name: Bug report
description: Something in Hush is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Search or playback suddenly failing for everything? YouTube may have changed something.
        Check whether a newer NewPipeExtractor release exists, and mention it below.
  - type: input
    id: version
    attributes:
      label: Hush version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 7, Android 14"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Search
        2. Search for ...
        3. Tap ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error message
      description: Optional. Paste any error text shown, or `adb logcat` output.
      render: shell
