name: Release

# Runs when a tag like v1.0.1 is created (by pushing it, or by publishing a release on GitHub
# with a new tag). Builds the APK and attaches it to the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Optional: add these repository secrets to sign releases with your own stable key,
      # so users can update in place. Without them the APK is signed with a debug key.
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hush.jks"
            {
              echo "HUSH_KEYSTORE_FILE=$RUNNER_TEMP/hush.jks"
              echo "HUSH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "HUSH_KEY_ALIAS=$KEY_ALIAS"
              echo "HUSH_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No signing secrets set; building with the debug key."
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Hush-${GITHUB_REF_NAME}.apk"
          APK="dist/Hush-${GITHUB_REF_NAME}.apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Release was created from the GitHub website: just attach the APK.
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --title "Hush ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
